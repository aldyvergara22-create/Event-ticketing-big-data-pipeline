version: "3.8"

services:
  web:
    build: ./app
    container_name: flask_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    depends_on:
      - db
      - redis

  db:
    image: postgres:14-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_broker
    ports:
      - "6379:6379"

  celery:
    build: ./app
    container_name: celery_worker
    command: celery -A app.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/ticketing
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  spark_analytics:
    image: apache/spark-py:latest
    container_name: spark_analytics
    user: root
    volumes:
      - .:/app
    working_dir: /app
    command: /opt/spark/bin/spark-submit --packages org.postgresql:postgresql:42.7.1 analytics.py
    depends_on:
      - db
    profiles:
      - analytics

volumes:
  postgres_data:
