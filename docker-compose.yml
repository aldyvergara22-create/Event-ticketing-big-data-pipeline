version: "3.8"

services:

db:
  image: postgres:15-alpine # Imagen de PostgreSQL
  container_name: postgres_db #nombre del contenedor
  environment: # Variables de entorno para la configuración de PostgreSQL
    POSTGRES_USER: postgres # Usuario de PostgreSQL
    POSTGRES_PASSWORD: password123 # Contraseña de PostgreSQL
    POSTGRES_DB: ticketing_db # Nombre de la base de datos
  ports: # Exponer el puerto 5432 del contenedor al host
    - "5432:5432" # Puerto 5432 del host mapeado al puerto 5432 del contenedor
  volumes: # Montar un volumen para persistir los datos de PostgreSQL
    - postgres_data:/var/lib/postgresql/data # Volumen para persistir los datos de PostgreSQL

web: # Servicio para la aplicación Flask
  build: ./app # Construir la imagen de Docker desde el directorio ./app
  container_name: flask_web
  ports:
    - "5000:5000" # Puerto 5000 del host mapeado al puerto 5000 del contenedor
  environment: # Variables de entorno para la aplicación Flask
    - DB_HOST=db
    - DB_NAME=ticketing_db
    - DB_USER=postgres
    - DB_PASSWORD=password123
  depends_on: # Dependencias del servicio web
    - db # El servicio web depende del servicio db (PostgreSQL)
  volumes:
    postgres_data: # Definición del volumen para persistir los datos de PostgreSQL
